name: RPA demo checks

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run demo tests
        run: python -m unittest discover -s rpa_demo/tests -v
      - name: Run offline demo
        run: python -m rpa_demo --output-dir build/ci-demo --as-of 2026-01-15 --min-days-overdue 7
